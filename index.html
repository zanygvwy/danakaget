<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagi-Bagi Dana Kaget Harian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 text-center shadow-xl border border-slate-700">
    <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
      🎁
    </div>
    
    <h1 class="text-2xl font-bold mb-2">Dana Kaget Hari Ini</h1>
    <p id="note" class="text-slate-400 text-sm mb-6">Memuat link terbaru...</p>

    <!-- Tombol Klaim -->
    <a id="claimBtn" href="#" target="_blank" rel="noopener noreferrer"
       class="hidden block w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:scale-95 transition rounded-xl font-semibold shadow-lg shadow-blue-600/30">
      Buka Dana Kaget Sekarang
    </a>

    <div id="emptyNotice" class="hidden text-amber-400 bg-amber-400/10 border border-amber-400/20 p-3 rounded-lg text-sm">
      Belum ada link aktif saat ini. Cek kembali nanti!
    </div>

    <p id="updatedAt" class="text-xs text-slate-500 mt-6"></p>
  </div>

  <script>
    async function loadLink() {
      try {
        const res = await fetch('/api/links');
        const data = await res.json();
        
        document.getElementById('note').innerText = data.note || 'Klaim sebelum kehabisan!';
        
        if (data.link) {
          const btn = document.getElementById('claimBtn');
          btn.href = data.link;
          btn.classList.remove('hidden');
          document.getElementById('updatedAt').innerText = `Terakhir diperbarui: ${data.updatedAt || '-'}`;
        } else {
          document.getElementById('emptyNotice').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('note').innerText = 'Gagal memuat link.';
      }
    }
    loadLink();
  </script>
</body>
</html>
